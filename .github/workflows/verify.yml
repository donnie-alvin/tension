name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm type-check
      - name: unit tests
        run: pnpm run --if-present test:unit
      - name: integration tests
        run: pnpm run --if-present test:integration
      - name: AST validation
        run: pnpm run --if-present validate:ast
      - name: security scanning
        run: pnpm audit --audit-level moderate
      - name: orchestration validation
        run: pnpm run --if-present validate:orchestration
      - name: AI review
        run: pnpm run --if-present review:ai
