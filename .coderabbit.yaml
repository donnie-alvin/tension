# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-GB'
early_access: false

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  review_details: false
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_filters:
    - '!node_modules/**'
    - '!.turbo/**'
    - '!logs/**'
    - '!**/.next/**'
    - '!**/dist/**'
    - '!**/build/**'
    - '!**/*.tsbuildinfo'
    - '!pnpm-lock.yaml'
  path_instructions:
    - path: 'apps/web/**/*.tsx'
      instructions: 'Review React and Next.js code for accessibility, server/client component boundaries, state management simplicity, and UI regressions across responsive layouts.'
    - path: 'apps/web/app/api/**/*.ts'
      instructions: 'Review API routes for authentication, input validation, error handling, and avoiding accidental exposure of sensitive data.'
    - path: 'packages/shared/**/*.ts'
      instructions: 'Review shared package changes for stable exported contracts, type safety, and compatibility with all workspace consumers.'

chat:
  auto_reply: true
